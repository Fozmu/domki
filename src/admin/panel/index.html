<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel Administracyjny — Domki Cesarz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 700; color: #fff; }

        .gold { color: #d4af37; }

        /* ----- Login ----- */
        #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: min(360px, 100%); background: #111118; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 32px; }
        .login-box h1 { font-size: 1.6rem; margin-bottom: 4px; }
        .login-box p { color: #888; font-size: .9rem; margin-bottom: 22px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: .8rem; font-weight: 600; color: #d4af37; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 12px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: .95rem; }
        .field input:focus { outline: none; border-color: #d4af37; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%); color: #0a0a0a; font-weight: 700; font-size: .92rem;
            padding: 11px 18px; border-radius: 8px; transition: transform .2s, box-shadow .2s; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(212,175,55,.35); }
        .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-outline { background: none; border: 1px solid rgba(255,255,255,.25); color: #e5e5e5; }
        .btn-outline:hover { border-color: #d4af37; color: #d4af37; box-shadow: none; }
        .btn-danger { background: rgba(255,46,106,.15); color: #ff8fac; border: 1px solid rgba(255,46,106,.4); }
        .btn-danger:hover { box-shadow: 0 8px 20px rgba(255,46,106,.25); }
        .btn-small { padding: 6px 12px; font-size: .8rem; border-radius: 6px; }
        .msg { border-radius: 8px; padding: 10px 12px; font-size: .88rem; margin-bottom: 14px; }
        .msg.error { background: rgba(255,46,106,.12); border: 1px solid rgba(255,46,106,.4); color: #ff8fac; }

        /* ----- Dashboard ----- */
        #dashboardView { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
        header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        header.top h1 { font-size: 1.7rem; }

        .panel { background: #111118; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 22px; margin-bottom: 26px; }
        .panel-title { font-size: 1.2rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

        .houses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
        .house-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px; }
        .house-card .num { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .house-status { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
            padding: 3px 9px; border-radius: 100px; margin: 6px 0 10px; }
        .house-status.free { background: rgba(37,211,102,.15); color: #5dffa0; }
        .house-status.occupied { background: rgba(255,46,106,.15); color: #ff8fac; }
        .house-guest { font-size: .82rem; color: #b0b0b0; margin-bottom: 10px; min-height: 1.2em; }
        .clean-toggle { width: 100%; font-size: .78rem; padding: 7px 10px; }
        .clean-toggle.dirty { background: rgba(255,180,40,.15); border: 1px solid rgba(255,180,40,.4); color: #ffcf70; }
        .clean-toggle.clean { background: rgba(37,211,102,.1); border: 1px solid rgba(37,211,102,.3); color: #5dffa0; }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: none; border: 1px solid rgba(255,255,255,.16); color: #b0b0b0; padding: 7px 14px;
            border-radius: 100px; font-size: .82rem; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: rgba(212,175,55,.15); border-color: #d4af37; color: #d4af37; }

        table { width: 100%; border-collapse: collapse; font-size: .85rem; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap; }
        th { color: #888; font-weight: 600; text-transform: uppercase; font-size: .72rem; letter-spacing: .03em; }
        tbody tr:hover { background: rgba(255,255,255,.03); }
        .table-scroll { overflow-x: auto; }
        .badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
        .badge.pending { background: rgba(255,180,40,.15); color: #ffcf70; }
        .badge.confirmed { background: rgba(37,211,102,.15); color: #5dffa0; }
        .badge.cancelled { background: rgba(255,46,106,.15); color: #ff8fac; }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .empty-note { color: #666; font-size: .88rem; padding: 20px 0; text-align: center; }
    </style>
</head>
<body>

    <div id="loginView">
        <div class="login-box">
            <h1>Panel <span class="gold">Administracyjny</span></h1>
            <p>Domki Cesarz</p>
            <div id="loginMsg" class="msg error" hidden></div>
            <form id="loginForm">
                <div class="field">
                    <label>Login</label>
                    <input type="text" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label>Hasło</label>
                    <input type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn" id="loginBtn" style="width:100%;">Zaloguj się</button>
            </form>
        </div>
    </div>

    <div id="dashboardView" hidden>
        <header class="top">
            <h1>Panel <span class="gold">Administracyjny</span></h1>
            <button type="button" class="btn btn-outline btn-small" id="logoutBtn">
                <i class="fas fa-right-from-bracket"></i> Wyloguj
            </button>
        </header>

        <section class="panel">
            <div class="panel-title">
                <span>Domki</span>
                <button type="button" class="btn btn-outline btn-small" id="refreshHousesBtn">
                    <i class="fas fa-rotate"></i> Odśwież
                </button>
            </div>
            <div class="houses-grid" id="housesGrid"></div>
        </section>

        <section class="panel">
            <div class="panel-title">
                <span>Rezerwacje</span>
                <div class="tabs" id="bookingTabs">
                    <button type="button" class="tab-btn active" data-scope="today">Dziś</button>
                    <button type="button" class="tab-btn" data-scope="upcoming">Nadchodzące</button>
                    <button type="button" class="tab-btn" data-scope="all">Wszystkie</button>
                </div>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Domek</th>
                            <th>Gość</th>
                            <th>Email</th>
                            <th>Telefon</th>
                            <th>Przyjazd</th>
                            <th>Wyjazd</th>
                            <th>Status</th>
                            <th>Depozyt</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody"></tbody>
                </table>
                <div class="empty-note" id="bookingsEmpty" hidden>Brak rezerwacji w tym widoku.</div>
            </div>
        </section>
    </div>

    <script>
        const API = '/.netlify/functions';
        let currentScope = 'today';

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // ----- Auth -----
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginMsg = document.getElementById('loginMsg');

        function showLogin() {
            loginView.hidden = false;
            dashboardView.hidden = true;
        }

        function showDashboard() {
            loginView.hidden = true;
            dashboardView.hidden = false;
            loadHouses();
            loadBookings();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginMsg.hidden = true;
            try {
                const res = await fetch(`${API}/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: loginForm.elements.username.value.trim(),
                        password: loginForm.elements.password.value
                    })
                });
                if (res.ok) {
                    loginForm.reset();
                    showDashboard();
                } else {
                    loginMsg.hidden = false;
                    loginMsg.textContent = 'Nieprawidłowy login lub hasło.';
                }
            } catch {
                loginMsg.hidden = false;
                loginMsg.textContent = 'Błąd połączenia. Spróbuj ponownie.';
            } finally {
                loginBtn.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch(`${API}/admin-logout`, { method: 'POST' });
            showLogin();
        });

        // ----- Houses -----
        const housesGrid = document.getElementById('housesGrid');

        async function loadHouses() {
            housesGrid.innerHTML = '<p style="color:#666;">Ładowanie...</p>';
            const res = await fetch(`${API}/admin-houses`);
            if (res.status === 401) return showLogin();
            const data = await res.json();

            housesGrid.innerHTML = (data.houses || []).map((h) => {
                const statusClass = h.occupied ? 'occupied' : 'free';
                const statusLabel = h.occupied ? 'Zajęty' : 'Wolny';
                const guestLine = h.occupied
                    ? `${esc(h.guest.firstName)} ${esc(h.guest.lastName)} — do ${esc(h.guest.checkOut)}`
                    : '';
                const cleanClass = h.cleaned ? 'clean' : 'dirty';
                const cleanLabel = h.cleaned ? '<i class="fas fa-check"></i> Posprzątany' : '<i class="fas fa-broom"></i> Do sprzątania';
                return `
                    <div class="house-card">
                        <div class="num">Domek ${h.houseId}</div>
                        <span class="house-status ${statusClass}">${statusLabel}</span>
                        <div class="house-guest">${guestLine}</div>
                        <button type="button" class="btn clean-toggle ${cleanClass}" data-house="${h.houseId}" data-cleaned="${h.cleaned}">
                            ${cleanLabel}
                        </button>
                    </div>`;
            }).join('') || '<p style="color:#666;">Brak domków.</p>';

            housesGrid.querySelectorAll('.clean-toggle').forEach((btn) => {
                btn.addEventListener('click', async () => {
                    const houseId = Number(btn.dataset.house);
                    const nextCleaned = btn.dataset.cleaned !== 'true';
                    btn.disabled = true;
                    await fetch(`${API}/admin-houses`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ houseId, cleaned: nextCleaned })
                    });
                    loadHouses();
                });
            });
        }

        document.getElementById('refreshHousesBtn').addEventListener('click', loadHouses);

        // ----- Bookings -----
        const bookingsBody = document.getElementById('bookingsBody');
        const bookingsEmpty = document.getElementById('bookingsEmpty');
        const bookingTabs = document.getElementById('bookingTabs');

        bookingTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            bookingTabs.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            currentScope = btn.dataset.scope;
            loadBookings();
        });

        function statusBadge(status) {
            const labels = { pending: 'Oczekująca', confirmed: 'Potwierdzona', cancelled: 'Anulowana' };
            return `<span class="badge ${esc(status)}">${esc(labels[status] || status)}</span>`;
        }

        async function loadBookings() {
            bookingsBody.innerHTML = `<tr><td colspan="9" style="color:#666;">Ładowanie...</td></tr>`;
            bookingsEmpty.hidden = true;

            const res = await fetch(`${API}/admin-bookings?scope=${encodeURIComponent(currentScope)}`);
            if (res.status === 401) return showLogin();
            const data = await res.json();
            const bookings = data.bookings || [];

            if (!bookings.length) {
                bookingsBody.innerHTML = '';
                bookingsEmpty.hidden = false;
                return;
            }

            bookingsBody.innerHTML = bookings.map((b) => `
                <tr data-id="${esc(b.id)}">
                    <td>Domek ${esc(b.houseId)}</td>
                    <td>${esc(b.firstName)} ${esc(b.lastName)}</td>
                    <td>${esc(b.email)}</td>
                    <td>${esc(b.phone)}</td>
                    <td>${esc(b.checkIn)}</td>
                    <td>${esc(b.checkOut)}</td>
                    <td>${statusBadge(b.status)}</td>
                    <td>${b.depositPaid ? '<i class="fas fa-check" style="color:#5dffa0;"></i> Wpłacony' : '<i class="fas fa-xmark" style="color:#ff8fac;"></i> Brak'} (${esc(b.depositAmount)} zł)</td>
                    <td>
                        <div class="row-actions">
                            ${b.status !== 'confirmed' ? '<button type="button" class="btn btn-outline btn-small" data-action="confirm">Potwierdź</button>' : ''}
                            ${b.status !== 'cancelled' ? '<button type="button" class="btn btn-danger btn-small" data-action="cancel">Anuluj</button>' : ''}
                            ${!b.depositPaid ? '<button type="button" class="btn btn-outline btn-small" data-action="deposit">Depozyt wpłacony</button>' : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        bookingsBody.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const row = btn.closest('tr');
            const id = row.dataset.id;
            btn.disabled = true;

            const patch = { id };
            if (btn.dataset.action === 'confirm') patch.status = 'confirmed';
            if (btn.dataset.action === 'cancel') patch.status = 'cancelled';
            if (btn.dataset.action === 'deposit') patch.depositPaid = true;

            await fetch(`${API}/admin-bookings`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patch)
            });
            loadBookings();
            loadHouses();
        });

        // ----- Init: check for an existing session -----
        (async () => {
            const res = await fetch(`${API}/admin-houses`);
            if (res.ok) showDashboard();
            else showLogin();
        })();
    </script>
</body>
</html>
